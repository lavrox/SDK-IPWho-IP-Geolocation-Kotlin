name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: ./gradlew --no-daemon test jar
      - name: Report how many tests ran
        run: |
          grep -h '<testsuite ' build/test-results/test/*.xml | sed -E 's/ timestamp=.*//'
          total=$(grep -ho '<testsuite [^>]*' build/test-results/test/*.xml | sed -E 's/.* tests="([0-9]+)".*/\1/' | awk '{s+=$1} END {print s+0}')
          echo "Tests run: $total"
          test "$total" -gt 0
      - name: The published dependency list has no Ktor
        run: |
          ./gradlew --no-daemon generatePomFileForMavenPublication
          pom=$(find build/publications -name pom-default.xml | head -1)
          cat "$pom"
          grep -q kotlinx-serialization-json "$pom"
          ! grep -qi ktor "$pom"

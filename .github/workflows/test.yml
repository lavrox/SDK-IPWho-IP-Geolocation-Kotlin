name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: ./gradlew --no-daemon test jar
      - name: The published dependency list has no Ktor
        run: |
          ./gradlew --no-daemon generatePomFileForMavenPublication
          pom=$(find build/publications -name pom-default.xml | head -1)
          cat "$pom"
          grep -q kotlinx-serialization-json "$pom"
          ! grep -qi ktor "$pom"
